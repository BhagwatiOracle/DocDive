[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BhagwatiOracle", email = "bhagwati101x@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "cohere>=5.21.1",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langsmith>=0.11.1",
    "pdf2image>=1.17.0",
    "pdfminer-six>=20260107",
    "pikepdf>=10.12.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "unstructured[pdf]>=0.27.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
multimodal-rag = "multimodal_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
